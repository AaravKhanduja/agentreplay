name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v7

      # No `version:` here on purpose — package.json's `packageManager` field
      # is the single source of truth, and the action errors if both are set.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --frozen-lockfile is the point: it fails when package.json and
      # pnpm-lock.yaml disagree, which is otherwise invisible until someone
      # clones the repo for the first time.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The artifact has to actually generate, not just compile.
      - name: Generate the demo replay
        run: node packages/cli/dist/index.js --demo --no-ollama --out /tmp/demo.html

      # The demo is a Claude Code session, so the Codex reader needs its own
      # end-to-end run: unit tests would not catch a break between the CLI,
      # the source registry and the generated page.
      - name: Generate a Codex replay
        run: |
          node packages/cli/dist/index.js \
            packages/core/test/fixtures/codex-exec.jsonl \
            --no-ollama --out /tmp/codex.html
          grep -q '"agent":"codex"' /tmp/codex.html

      - name: Check the artifacts are self-contained
        run: |
          for page in /tmp/demo.html /tmp/codex.html; do
            test -s "$page"
            # No http(s) references: the page must work offline, forever.
            ! grep -qE 'src="https?://|href="https?://[^"]*\.css' "$page"
          done
