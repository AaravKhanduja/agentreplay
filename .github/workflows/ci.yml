name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - run: python -m unittest discover tests

      # The pages have to actually generate, not just pass unit tests.
      - name: Generate the demo pages
        run: python agentreplay.py --demo --no-open --out-dir /tmp/demo

      - name: Check the pages are self-contained
        run: |
          for page in /tmp/demo/agentreplay.html /tmp/demo/agentreplay-card.html; do
            test -s "$page"
            # Nothing loads from the network: no external scripts, styles or fonts.
            ! grep -qE '<link|src="https?://|url\(https?://' "$page"
          done
