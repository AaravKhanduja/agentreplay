name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — package.json's `packageManager` field
      # is the single source of truth, and the action errors if both are set.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --frozen-lockfile is the point: it fails when package.json and
      # pnpm-lock.yaml disagree, which is otherwise invisible until someone
      # clones the repo for the first time.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The artifact has to actually generate, not just compile.
      - name: Generate the demo replay
        run: node packages/cli/dist/index.js --demo --no-ollama --out /tmp/demo.html

      - name: Check the artifact is self-contained
        run: |
          test -s /tmp/demo.html
          # No http(s) references: the page must work offline, forever.
          ! grep -qE 'src="https?://|href="https?://[^"]*\.css' /tmp/demo.html
