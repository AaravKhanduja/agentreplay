name: Release

# npm versions are immutable — a bad publish can only be superseded, never
# fixed. So the pipeline splits in two: `verify` runs unattended, and `publish`
# waits on the `npm-publish` environment for a human to approve it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run everything except the publish step'
        type: boolean
        default: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      # The tarball is built from gitignored output, so check its contents here
      # rather than discovering a missing binary after it is already published.
      - name: Inspect the tarball
        working-directory: packages/cli
        run: npm pack --dry-run

  publish:
    needs: verify
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    # Pauses here for approval. Configured at:
    # Settings → Environments → npm-publish → required reviewers.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing and provenance

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # OIDC token exchange landed in npm 11.5.1 and Node 22 still ships 10.x,
      # so the runner's bundled npm cannot authenticate as a trusted publisher.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      # There is no NPM_TOKEN. npm authenticates as a trusted publisher: the
      # runner exchanges its OIDC identity for a short-lived credential, which
      # npm accepts only from this repository, workflow and environment (set at
      # npmjs.com → agentreplay-cli → Settings → Trusted Publisher). Nothing
      # long-lived is stored, and there is no secret to leak or rotate.
      #
      # --provenance publishes a signed attestation linking this tarball to this
      # repository and commit, which npm shows on the package page. It needs the
      # id-token permission above.
      - name: Publish to npm
        working-directory: packages/cli
        run: npm publish --provenance

  # A tag push should never again publish to npm and silently skip the GitHub
  # release. This drafts one rather than publishing it: the notes on 0.1.0-0.1.2
  # were written by hand and read better than any generated commit list, so the
  # job guarantees the release object exists with a starting point, and a human
  # edits and publishes it. Skipped on workflow_dispatch, which has no tag.
  github-release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating a release writes to the repository

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --generate-notes needs history to diff against

      # Idempotent: a re-run of a release that already has one must not fail.
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
