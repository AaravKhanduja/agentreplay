<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentreplay</title>
<style>
/*__FONTS__*/
:root{--ground:#141413;--text:#faf9f5;--text2:#d6d1c7;--muted:#9a948a;--faint:#6b665d;--rule:#2b2a27;--track:#1c1f23;--cell:#222120;--bar2:#3d4652;--accent:#d97757;--friction:#7cc4d6;--line:#36342f;--mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--sans)}
a{color:var(--text2);text-decoration:none}a:hover{color:var(--text)}
button{font:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:40px 16px 80px;display:flex;flex-direction:column;gap:52px}
.mono{font-family:var(--mono)}
.hdr{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-family:var(--mono);font-size:14px;color:var(--muted)}
.mark{width:10px;height:10px;background:var(--accent);display:inline-block}
.ranges{display:flex;border:1px solid var(--line)}
.ranges button{font-family:var(--mono);font-size:13px;padding:8px 14px;min-height:28px;border:0;border-right:1px solid var(--line);cursor:pointer;background:transparent;color:var(--muted)}
.ranges button:last-child{border-right:0}
.ranges button:hover{color:var(--text)}
.ranges button.on{background:var(--text);color:var(--ground)}
.btn{font-family:var(--mono);font-size:13px;border:1px solid var(--line);background:transparent;padding:8px 14px;color:var(--text);min-height:28px;display:inline-flex;align-items:center;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.ranges button:focus-visible{outline:1px solid var(--muted);outline-offset:2px}
.months{position:relative;height:16px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.months span{position:absolute;top:0}
.days{position:relative;flex:none;width:28px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.days span{position:absolute;left:0;line-height:1;transform:translateY(-50%)}
.grid{position:relative;min-width:0;max-width:100%;overflow-x:auto;padding:5px;margin:-5px}
.grid .cells{position:relative}
.grid .c{position:absolute;border-radius:2px;opacity:var(--o);transition:transform .15s ease,filter .2s ease,box-shadow .15s ease;animation:pop .75s cubic-bezier(.33,0,.2,1) backwards}
.grid .cells .c:hover{transform:scale(1.5);box-shadow:0 0 0 1.5px var(--text);z-index:2}
.tip{position:fixed;z-index:12;pointer-events:none;background:#2b2a27;color:var(--text);font-size:13px;line-height:1;padding:8px 10px;border-radius:4px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s ease,left .1s ease,top .1s ease}
.tip.on{opacity:1}
.streakbox{position:absolute;border:1.5px solid var(--accent);border-radius:5px;pointer-events:none;animation:fade .8s ease 1.3s backwards}
.headline{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.headline .big{font-family:var(--mono);font-size:64px;line-height:1;font-weight:500;letter-spacing:-0.03em;color:var(--accent)}
.headline .dates{font-family:var(--mono);font-size:15px;color:var(--muted)}
.sentence{font-size:20px;color:var(--text2);line-height:1.4;margin-top:12px}
.sentence b{font-weight:400;color:var(--accent)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:24px 16px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:24px 0}
.stat .n{font-family:var(--mono);font-size:28px;font-weight:500}
.stat .l{font-size:13px;color:var(--muted);margin-top:4px}
.tools{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:-28px}
.tools b{font-weight:400;color:var(--text)}
h2{margin:0;font-size:18px;font-weight:600}
.sec{display:flex;flex-direction:column;gap:18px}
.sechdr{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.sechdr span{font-family:var(--mono);font-size:13px;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:14px}
.row{display:grid;gap:16px;align-items:center}
.row .name{font-family:var(--mono);font-size:14px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:14px;background:var(--track)}.bar i{display:block;height:100%;transform-origin:left;animation:grow 1.3s cubic-bezier(.33,0,.2,1) backwards}
.row .v{font-family:var(--mono);font-size:14px;color:var(--text);text-align:right}
.row .v2{font-family:var(--mono);font-size:14px;color:var(--muted);text-align:right}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:40px 48px}
.heat{display:flex;flex-direction:column;gap:4px}
.heat .r{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;align-items:center}
.heat .d{font-family:var(--mono);font-size:11px;color:var(--muted)}
.heat .cells{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:2px}
.heat .cells i{display:block;height:14px;transition:box-shadow .15s ease}
.heat .cells i:hover{box-shadow:0 0 0 1.5px var(--text)}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint)}
.note{font-size:14px;color:var(--text2)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.list .li{display:grid;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule);transition:background .15s ease}
a.li:hover{background:var(--track)}
.foot{font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--faint);border-top:1px solid var(--rule);padding-top:20px}
.empty{font-size:20px;color:var(--text2)}
.overlay{position:fixed;inset:0;background:rgba(10,10,9,.82);display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}
.panel{background:var(--ground);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:16px;max-width:100%}
.panel canvas{display:block;width:960px;max-width:calc(100vw - 90px);height:auto;border:1px solid var(--rule)}
.notice{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:11;background:rgba(10,10,9,.6)}
.notice .box{background:var(--ground);border:1px solid var(--line);padding:24px 28px;width:420px;max-width:100%;display:flex;flex-direction:column;gap:12px}
.notice .title{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:15px;color:var(--text)}
.notice .body{font-size:14px;line-height:1.5;color:var(--text2)}
.notice kbd{font-family:var(--mono);font-size:13px;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.notice .row2{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.actions .status{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleX(0)}}
.intro>*{animation:rise 1s cubic-bezier(.33,0,.2,1) backwards}
.swap>:not(.hdr){animation:fade .5s ease backwards}
.wait,.wait *{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
body.card{width:1200px;height:675px;overflow:hidden}
body.card canvas{display:block;width:1200px;height:675px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script type="application/json" id="data">/*__DATA__*/null</script>
<script>
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
const DAY = 86400000;
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEKDAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const WEEKDAYS_LONG = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const OPACITY = [0, 0.2, 0.38, 0.56, 0.78, 1.0];
const C = {ground:'#141413',text:'#faf9f5',text2:'#d6d1c7',muted:'#9a948a',rule:'#2b2a27',cell:'#222120',accent:'#d97757'};
const MONO = "'IBM Plex Mono', ui-monospace, monospace", SANS = "'IBM Plex Sans', system-ui, sans-serif";
const REPO = 'https://github.com/AaravKhanduja/agentreplay';
const RANGE_LABELS = Object.fromEntries(D.ranges);

// ---------------------------------------------------------------- helpers

// Build DOM without innerHTML: every string from the data lands as text.
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})){
    if (v == null || v === false) continue;
    if (k === 'style') el.style.cssText = v;
    else if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el[k] = v;
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
const day = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); };
const fmtDay = s => { const d = day(s); return MONTHS[d.getMonth()] + ' ' + d.getDate(); };
const int = n => Math.round(n).toLocaleString('en-US');
function compact(n){
  for (const [unit, s] of [[1e9,'B'],[1e6,'M'],[1e3,'k']]){
    if (n >= unit){ const v = n / unit; return (v >= 100 ? Math.round(v) : v.toFixed(1)) + s; }
  }
  return String(Math.round(n));
}
function hours(ms){ const v = ms / 3.6e6; return v >= 10 || v === 0 ? String(Math.round(v)) : v.toFixed(1); }
const plural = (n, word) => int(n) + ' ' + word + (Math.round(n) === 1 ? '' : 's');
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const hourLabel = hr => (hr % 12 || 12) + (hr < 12 ? 'am' : 'pm');
const modelName = m => m.replace(/^claude-/, '');

// ---------------------------------------------------------------- stats

// Two sources: every session and prompt (from prompt history, the whole
// year) and per-transcript detail (only as far back as transcripts survive).
function stats(key){
  const cut = D.cutoffs[key], end = D.ends[key], cutDay = D.cutoffDays[key], endDay = D.endDays[key];
  const inRange = t => t >= cut && t < end;
  const all = D.allSessions.filter(([start]) => inRange(start));
  const sessions = D.sessions.filter(s => inRange(s.start));
  // Detail covers only part of this range: say from when. A range that ended
  // before the oldest transcript has no detail at all.
  const gone = !!D.detailSince && D.detailSince > endDay;
  const since = gone ? '(transcripts deleted)'
    : D.detailSince && D.detailSince > cutDay ? 'since ' + fmtDay(D.detailSince) : '';
  let workMs = 0;
  for (const [a, b] of D.intervals){
    if (b <= cut || a >= end) continue;
    workMs += Math.min(b, end) - Math.max(a, cut);
  }
  const tok = [0,0,0,0], lines = [0,0], tools = {}, models = {}, mcp = {}, projects = {};
  const heat = Array.from({length:7}, () => new Array(24).fill(0));
  for (const [d, hr, n] of D.prompts){
    if (d >= cutDay && d <= endDay) heat[(day(d).getDay() + 6) % 7][hr] += n;
  }
  for (const s of sessions){
    s.tok.forEach((n, i) => tok[i] += n);
    lines[0] += s.lines[0]; lines[1] += s.lines[1];
    for (const [n, c] of Object.entries(s.tools)) tools[n] = (tools[n] || 0) + c;
    for (const [m, [t, turns]] of Object.entries(s.models)){
      const e = models[m] || (models[m] = [0, 0]); e[0] += t; e[1] += turns;
    }
    for (const [srv, v] of Object.entries(s.mcp)){
      const e = mcp[srv] || (mcp[srv] = [0,0,0]); v.forEach((n, i) => e[i] += n);
    }
    const name = D.projects[s.project];
    const p = projects[name] || (projects[name] = {tokens:0, sessions:0});
    p.tokens += s.tok[0] + s.tok[1] + s.tok[2] + s.tok[3]; p.sessions += 1;
  }
  return {
    key, since, gone, workMs,
    sessions: all.length, projectCount: new Set(all.map(([, p]) => p)).size,
    first: all.length ? new Date(all[0][0]) : null,
    tokens: tok[0] + tok[1] + tok[2] + tok[3], cacheRead: tok[3], lines,
    tools, models, mcp, heat,
    projects: Object.entries(projects).sort((a, b) => b[1].tokens - a[1].tokens),
    prs: D.prs.filter(p => inRange(p.ts)),
  };
}

// The streak when it is worth leading with: more than a week. Otherwise the
// range's session count.
function headline(st){
  const s = D.streaks[st.key].longest;
  if (s && s.days > 7){
    return {big: s.days + '-day streak', dates: fmtDay(s.start) + ' to ' + fmtDay(s.end)};
  }
  const dates = st.key === 'year'
    ? (st.first ? 'since ' + fmtDay(D.firstDay) : '')
    : 'in ' + RANGE_LABELS[st.key];
  return {big: plural(st.sessions, 'session'), dates};
}

// "since Sep 1" appended to a label when the detail covers only part of the range.
const within = (label, st) => st.since ? label + ' ' + st.since : label;

// [text, highlighted] parts of the one sentence, shared by page and card.
function sentence(st){
  const projects = st.projectCount;
  let lead = plural(st.sessions, 'session');
  if (st.key === 'year'){
    if (st.first){
      const y = st.first.getFullYear() !== new Date().getFullYear() ? ' ' + st.first.getFullYear() : '';
      lead += ' since ' + MONTHS_LONG[st.first.getMonth()] + y;
    }
  } else {
    lead += ' in ' + RANGE_LABELS[st.key];
  }
  lead += ' across ' + plural(projects, 'project') + '.';
  // No transcripts survive from this range, so there are no hours to report.
  if (st.gone) return [[lead, false]];
  lead += ' ' + (st.since ? 'Since ' + fmtDay(D.detailSince) + ', Claude worked ' : 'Claude worked ');
  const worked = hours(st.workMs);
  return [[lead, false], [worked + (worked === '1' ? ' hour' : ' hours'), true], ['.', false]];
}

// ---------------------------------------------------------------- year grid

function gridModel(key){
  const grid = D.grids[key], start = day(grid.start);
  // Level -1 pads the first week out to Monday; those days aren't drawn.
  const cells = grid.levels.map((level, i) => {
    const d = new Date(start.getTime() + i * DAY);
    return {i, col: Math.floor(i / 7), row: i % 7, level, count: grid.counts[i], date: d};
  }).filter(c => c.level >= 0);
  const cols = Math.ceil(grid.levels.length / 7);
  const months = []; let last = -1;
  cells.forEach((c, n) => {
    if (c.date.getMonth() !== last){
      last = c.date.getMonth();
      if (n > 0 && n < 5) return;  // first month has too few days to label
      months.push({col: c.col, name: MONTHS[last]});
    }
  });
  let streak = null;
  const s = D.streaks[key].longest;
  if (s && s.days > 1){  // a one-day streak isn't worth an outline
    const col = iso => Math.floor(Math.round((day(iso) - start) / DAY) / 7);
    streak = {c0: Math.max(col(s.start), 0), c1: col(s.end)};
  }
  return {cells, months, streak, cols};
}

// "6 prompts on September 28th." in GitHub's phrasing.
function ordinal(n){
  const t = n % 100;
  if (t >= 11 && t <= 13) return n + 'th';
  return n + ({1:'st', 2:'nd', 3:'rd'}[n % 10] || 'th');
}
function dayTip(count, date){
  const when = MONTHS_LONG[date.getMonth()] + ' ' + ordinal(date.getDate());
  return (count ? plural(count, 'prompt') : 'No prompts') + ' on ' + when + '.';
}
const tip = h('div', {class:'tip'});
const hideTip = () => tip.classList.remove('on');
window.addEventListener('scroll', hideTip, true);

function yearGrid(key, cell, gap){
  const pitch = cell + gap, g = gridModel(key);
  const W = g.cols * pitch - gap, H = 7 * pitch - gap;
  const box = h('div', {class:'cells', style:`width:${W}px;height:${H}px`});
  for (const c of g.cells){
    box.append(h('div', {class:'c', 'data-tip': dayTip(c.count, c.date), style:
      `left:${c.col*pitch}px;top:${c.row*pitch}px;width:${cell}px;height:${cell}px;` +
      `background:${c.level ? 'var(--accent)' : 'var(--cell)'};--o:${c.level ? OPACITY[c.level] : 1};` +
      `animation-delay:${c.col * 18 + c.row * 25}ms`}));
  }
  if (g.streak){
    box.append(h('div', {class:'streakbox', style:
      `left:${g.streak.c0*pitch-4}px;top:-4px;width:${(g.streak.c1-g.streak.c0+1)*pitch-gap+8}px;height:${H+8}px`}));
  }
  // One tooltip for the whole grid, placed just above whichever cell is hovered.
  box.onmouseover = e => {
    const text = e.target.dataset && e.target.dataset.tip;
    if (!text) return hideTip();
    const r = e.target.getBoundingClientRect();
    tip.textContent = text;
    // Glide between cells, but appear in place rather than sliding in from the last one.
    tip.style.transition = tip.classList.contains('on') ? '' : 'opacity .12s ease';
    tip.style.left = (r.left + r.width / 2) + 'px';
    tip.style.top = (r.top - 10) + 'px';
    tip.classList.add('on');
  };
  box.onmouseleave = hideTip;
  // GitHub labels every other weekday; rows start on Monday, so Mon/Wed/Fri are rows 0, 2 and 4.
  const days = h('div', {class:'days', style:`height:${H}px`},
    [0, 2, 4].map(r => h('span', {style:`top:${r*pitch + cell/2}px`}, WEEKDAYS[r])));
  const months = h('div', {class:'months', style:`width:${W}px;margin-left:32px`},
    g.months.map(m => h('span', {style:`left:${m.col*pitch}px`}, m.name)));
  return h('div', {style:'display:flex;flex-direction:column;gap:8px'}, months,
    h('div', {style:'display:flex;gap:4px'}, days, h('div', {class:'grid'}, box)));
}

// ---------------------------------------------------------------- page

let range = 'thisYear', firstRender = true;

function stat(n, l){ return h('div', {class:'stat'}, h('div', {class:'n'}, n), h('div', {class:'l'}, l)); }
function bar(width, top, i){
  return h('div', {class:'bar'}, h('i', {style:`width:${width}%;background:${top ? 'var(--accent)' : 'var(--bar2)'};animation-delay:${400 + 90 * i}ms`}));
}

// Count the first number in an element's text up from zero, keeping its format ("101M", "+14.2k", "48-day streak").
const MOTION = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(el){
  const text = el.textContent, m = text.match(/^(\D*?)(\d[\d,]*(?:\.\d+)?)(.*)$/s);
  if (!MOTION || !m) return;
  const target = parseFloat(m[2].replace(/,/g, '')), dec = (m[2].split('.')[1] || '').length, commas = m[2].includes(',');
  const t0 = performance.now(), dur = 1500;
  const step = now => {
    const t = Math.min(1, (now - t0) / dur), v = target * (t < .5 ? 4 * t * t * t : 1 - Math.pow(2 - 2 * t, 3) / 2);
    if (t >= 1) { el.textContent = text; return; }
    const n = commas ? Math.round(v).toLocaleString('en-US') : v.toFixed(dec);
    el.textContent = m[1] + n + m[3];
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function header(){
  const right = h('div', {style:'display:flex;gap:20px;align-items:center;flex-wrap:wrap'});
  if (D.allSessions.length){
    right.append(
      h('div', {class:'ranges'}, D.ranges.map(([k, label]) =>
        h('button', {class: k === range ? 'on' : '', onclick: () => { range = k; render(); }}, label))),
      h('button', {class:'btn', onclick: openExport}, 'Export card'));
  }
  return h('div', {class:'hdr'},
    h('div', {style:'display:flex;align-items:center;gap:12px'},
      h('span', {class:'mark'}), h('span', {style:'color:var(--text)'}, 'agentreplay'), h('span', {}, 'overview')),
    right);
}

function render(){
  const app = document.getElementById('app');
  hideTip();
  app.replaceChildren();
  app.append(header());
  if (!D.allSessions.length){
    app.append(h('div', {class:'empty'}, 'No Claude Code sessions found in ' + D.meta.source + '.'), footer());
    return;
  }
  const st = stats(range);
  const hl = headline(st);
  app.append(yearGrid(range, 16, 2));
  app.append(h('div', {style:'margin-top:-16px'},
    h('div', {class:'headline'}, h('div', {class:'big'}, hl.big), h('div', {class:'dates'}, hl.dates)),
    h('div', {class:'sentence'}, sentence(st).map(([t, hi]) => hi ? h('b', {}, t) : t))));
  app.append(h('div', {class:'strip'},
    stat(int(st.sessions), 'sessions'),
    stat(compact(st.tokens), within('tokens', st) + `, ${pct(st.cacheRead, st.tokens)}% cache reads`),
    stat(hours(st.workMs) + 'h', within('hours Claude worked', st)),
    stat('+' + compact(st.lines[0]), within('lines written', st)),
    stat(int(st.prs.length), within('PRs opened', st))));

  const tools = Object.entries(st.tools).sort((a, b) => b[1] - a[1]).slice(0, 4);
  if (tools.length){
    app.append(h('div', {class:'tools'}, within('Most used tools', st) + ': ',
      tools.map(([n, c], i) => [i ? ' · ' : '', h('b', {}, n), ' ' + compact(c)])));
  }

  if (st.projects.length){
    const max = st.projects[0][1].tokens || 1;
    app.append(h('div', {class:'sec'},
      h('div', {class:'sechdr'}, h('h2', {}, 'Where the tokens went'), h('span', {}, within('by project · sessions', st))),
      h('div', {class:'rows'}, st.projects.slice(0, 8).map(([name, p], i) =>
        h('div', {class:'row', style:'grid-template-columns:180px minmax(0,1fr) 64px 64px'},
          h('span', {class:'name', title: name}, name), bar(100 * p.tokens / max, i === 0, i),
          h('span', {class:'v'}, compact(p.tokens)), h('span', {class:'v2'}, int(p.sessions)))))));
    app.append(h('div', {class:'two'}, modelsSection(st), heatSection(st)));
  } else {
    app.append(h('div', {class:'two'}, heatSection(st)));
  }
  const mcp = mcpSection(st); if (mcp) app.append(mcp);
  const prs = prSection(st); if (prs) app.append(prs);
  app.append(footer());

  // Sections rise in one after another on load; a range switch just fades the new numbers in.
  app.className = 'wrap ' + (firstRender ? 'intro' : 'swap');
  if (firstRender) [...app.children].forEach((el, i) => { el.style.animationDelay = (i * 120) + 'ms'; });
  // Sections below the fold hold their first frame until you scroll to them.
  if (firstRender && MOTION && 'IntersectionObserver' in window){
    const io = new IntersectionObserver(entries => entries.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.style.animationDelay = '0ms';
      e.target.classList.remove('wait');
      io.unobserve(e.target);
    }), {rootMargin: '0px 0px -10% 0px'});
    for (const el of app.children){
      if (el.getBoundingClientRect().top > innerHeight){ el.classList.add('wait'); io.observe(el); }
    }
  }
  firstRender = false;
  app.querySelectorAll('.headline .big, .stat .n').forEach(countUp);
}

function modelsSection(st){
  const rows = Object.entries(st.models).sort((a, b) => b[1][0] - a[1][0]);
  const total = rows.reduce((n, [, v]) => n + v[0], 0) || 1;
  const turns = rows.reduce((n, [, v]) => n + v[1], 0) || 1;
  const max = rows.length ? rows[0][1][0] : 1;
  let note = '';
  if (rows.length === 1) note = `Every turn ran on ${modelName(rows[0][0])}.`;
  else if (rows.length > 1) note = `${modelName(rows[0][0])} took ${pct(rows[0][1][0], total)}% of tokens on ${pct(rows[0][1][1], turns)}% of turns.`;
  return h('div', {class:'sec'},
    h('div', {class:'sechdr'}, h('h2', {}, 'Models you ran'), h('span', {}, within('share of tokens', st))),
    h('div', {class:'rows', style:'gap:12px'}, rows.slice(0, 6).map(([m, [t]], i) =>
      h('div', {class:'row', style:'grid-template-columns:150px minmax(0,1fr) 48px'},
        h('span', {class:'name', style:'font-size:13px', title: m}, modelName(m)), bar(100 * t / max, i === 0, i),
        h('span', {class:'v', style:'font-size:13px'}, pct(t, total) + '%')))),
    note && h('div', {class:'note'}, note));
}

function heatSection(st){
  let max = 0, peak = null, total = 0, late = 0, work = 0;
  st.heat.forEach((row, wd) => row.forEach((n, hr) => {
    total += n; if (hr >= 22) late += n; if (hr >= 9 && hr < 18) work += n;
    if (n > max){ max = n; peak = [wd, hr]; }
  }));
  const rows = st.heat.map((row, wd) => h('div', {class:'r'},
    h('span', {class:'d'}, WEEKDAYS[wd]),
    h('div', {class:'cells'}, row.map((n, hr) => h('i', {
      title: `${WEEKDAYS[wd]} ${hourLabel(hr)}: ${plural(n, 'prompt')}`,
      style: n ? `background:var(--accent);opacity:${(0.08 + 0.92 * n / max).toFixed(2)}` : 'background:var(--cell)'})))));
  rows.push(h('div', {class:'r'}, h('span'), h('div', {class:'ticks'},
    ['12am','6am','12pm','6pm','11pm'].map(t => h('span', {}, t)))));
  let note = '';
  if (peak){
    note = `Peak is ${hourLabel(peak[1])} on ${WEEKDAYS_LONG[peak[0]]}s. `;
    note += pct(late, total) >= 10 ? `${pct(late, total)}% of your prompts land after 10pm.`
                                   : `${pct(work, total)}% of your prompts land between 9am and 6pm.`;
  }
  return h('div', {class:'sec'},
    h('div', {class:'sechdr'}, h('h2', {}, 'When you work'), h('span', {}, 'your prompts · local time')),
    h('div', {class:'heat'}, rows),
    note && h('div', {class:'note'}, note));
}

function mcpSection(st){
  const rows = Object.entries(st.mcp).map(([name, [calls, err, declined]]) => {
    const ran = calls - declined;
    return {name, calls, rate: ran > 0 ? err / ran : null};
  }).sort((a, b) => b.calls - a.calls).slice(0, 6);
  if (!rows.length) return null;
  const worst = Math.max(...rows.map(r => r.rate || 0));
  return h('div', {class:'sec'},
    h('div', {class:'sechdr'}, h('h2', {}, 'Top MCP servers'), h('span', {}, within('calls · error rate', st))),
    h('div', {class:'list'}, rows.map(r =>
      h('div', {class:'li', style:'grid-template-columns:minmax(0,1fr) 72px 56px;padding:12px 0'},
        h('span', {class:'name'}, r.name), h('span', {class:'v'}, int(r.calls)),
        h('span', {class:'v', style:`color:${worst > 0 && r.rate === worst ? 'var(--friction)' : 'var(--muted)'}`},
          r.rate == null ? '–' : Math.round(100 * r.rate) + '%')))));
}

function prSection(st){
  if (!st.prs.length) return null;
  return h('div', {class:'sec'},
    h('div', {class:'sechdr'}, h('h2', {}, 'PRs you opened'), h('span', {}, within('from gh pr create', st) + ' · ' + st.prs.length)),
    h('div', {class:'list'}, st.prs.map(p =>
      h('a', {class:'li', href: p.url, target:'_blank', rel:'noopener', style:'grid-template-columns:64px minmax(0,1fr) 160px 56px'},
        h('span', {class:'mono', style:'font-size:13px;color:var(--muted)'}, fmtDay(p.date)),
        h('span', {style:'font-size:15px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap'}, p.title),
        h('span', {class:'name', style:'font-size:13px;color:var(--muted)'}, p.repo),
        h('span', {class:'v', style:'font-size:13px;color:var(--text2)'}, '#' + p.number)))));
}

function footer(){
  const lines = [
    `Read from ${D.meta.source} on this machine. Nothing leaves it.`,
    D.meta.hasHistory && D.detailSince &&
      `Sessions, projects, prompts, the grid and the streak come from your prompt history. Claude Code deletes ` +
      `full transcripts after 30 days by default, so tokens, hours, lines, tools, models and PRs start ${fmtDay(D.detailSince)}.`,
    `Hours Claude worked count the gaps that end in Claude's reply or a tool result, dropping any gap over ${D.meta.idleGapMinutes} minutes.`,
    `Time you spend reading and typing isn't counted, and overlapping sessions count once.`,
  ];
  if (D.meta.skippedLines) lines.push(`${plural(D.meta.skippedLines, 'unreadable line')} skipped.`);
  return h('div', {class:'foot'}, lines.filter(Boolean).map(l => h('div', {}, l)));
}

// ---------------------------------------------------------------- card

const CARD_W = 1200, CARD_H = 675;

async function fontsReady(){
  if (!document.fonts) return;
  await Promise.all([`500 72px ${MONO}`, `400 15px ${MONO}`, `400 21px ${SANS}`]
    .map(f => document.fonts.load(f).catch(() => null)));
  await document.fonts.ready;
}

function drawCard(canvas){
  const scale = 2;
  canvas.width = CARD_W * scale; canvas.height = CARD_H * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.fillStyle = C.ground; ctx.fillRect(0, 0, CARD_W, CARD_H);
  ctx.textBaseline = 'alphabetic';
  const L = 44, R = CARD_W - 44;

  // Header.
  ctx.fillStyle = C.accent; ctx.fillRect(L, 49, 10, 10);
  ctx.font = `400 15px ${MONO}`; ctx.fillStyle = C.muted;
  ctx.textAlign = 'left'; ctx.fillText('agentreplay', L + 22, 59);
  ctx.textAlign = 'right';
  ctx.fillText('last 12 months', R, 59);
  ctx.textAlign = 'left';

  // Month labels and the year grid.
  const CELL = 19, GAP = 2, P = CELL + GAP, top = 132, g = gridModel('year');
  ctx.font = `400 12px ${MONO}`; ctx.fillStyle = C.muted;
  for (const m of g.months) ctx.fillText(m.name, L + m.col * P, top - 10);
  for (const c of g.cells){
    ctx.globalAlpha = c.level ? OPACITY[c.level] : 1;
    ctx.fillStyle = c.level ? C.accent : C.cell;
    roundRect(ctx, L + c.col * P, top + c.row * P, CELL, CELL, 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (g.streak){
    ctx.strokeStyle = C.accent; ctx.lineWidth = 1.5;
    roundRect(ctx, L + g.streak.c0 * P - 4.25, top - 4.25, (g.streak.c1 - g.streak.c0 + 1) * P - GAP + 8.5, 7 * P - GAP + 8.5, 5);
    ctx.stroke();
  }

  // Headline and sentence.
  const st = stats('year'), hl = headline(st);
  ctx.font = `500 72px ${MONO}`; ctx.fillStyle = C.accent;
  if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '-2px';
  ctx.fillText(hl.big, L, 418);
  const w = ctx.measureText(hl.big).width;
  if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '0px';
  ctx.font = `400 15px ${MONO}`; ctx.fillStyle = C.muted;
  ctx.fillText(hl.dates, L + w + 18, 418);
  ctx.font = `400 21px ${SANS}`;
  let x = L;
  for (const [t, hi] of sentence(st)){
    ctx.fillStyle = hi ? C.accent : C.text2; ctx.fillText(t, x, 470); x += ctx.measureText(t).width;
  }

  // Strip.
  const stripTop = 555, colW = (R - L) / 5;
  ctx.fillStyle = C.rule; ctx.fillRect(L, stripTop, R - L, 1);
  const cells = [[int(st.sessions), 'sessions'], [hours(st.workMs) + 'h', within('hours Claude worked', st)],
                 ['+' + compact(st.lines[0]), within('lines written', st)], [compact(st.tokens), within('tokens', st)],
                 [int(st.prs.length), within('PRs opened', st)]];
  cells.forEach(([n, l], i) => {
    ctx.font = `500 30px ${MONO}`; ctx.fillStyle = C.text; ctx.fillText(n, L + i * colW, stripTop + 52);
    ctx.font = `400 13px ${SANS}`; ctx.fillStyle = C.muted; ctx.fillText(l, L + i * colW, stripTop + 78);
  });
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function shareText(){
  const st = stats('year'), hl = headline(st);
  return `${hl.big} with Claude Code: ${plural(st.sessions, 'session')} across ${plural(st.projectCount, 'project')}.\n\n` +
         `See yours, fully local: ${REPO}`;
}

async function openExport(){
  await fontsReady();
  const canvas = h('canvas');
  drawCard(canvas);
  const status = h('span', {class:'status'});
  const close = () => { overlay.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => {
    if (e.key !== 'Escape') return;
    const open = document.querySelector('.notice');
    if (open) open.remove(); else close();
  };
  const download = () => canvas.toBlob(blob => {
    const a = h('a', {href: URL.createObjectURL(blob), download: 'agentreplay-card.png'});
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
  const paste = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘V' : 'Ctrl+V';
  // Starts the clipboard write synchronously, inside the click, which is what
  // browsers require; the PNG itself is handed over when it's encoded.
  const copyCard = () => {
    try {
      const blob = new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      return navigator.clipboard.write([new ClipboardItem({'image/png': blob})]).then(() => true, () => false);
    } catch (e) {
      return Promise.resolve(false);
    }
  };
  const copy = async () => {
    if (await copyCard()) status.textContent = 'Copied. Paste it into your post.';
    else { download(); status.textContent = 'Copying is blocked here, so the PNG was downloaded instead.'; }
  };
  // An X intent link can only carry text, so the card rides on the clipboard:
  // copy it, open the composer in a popup beside this page, and say how to
  // paste it. Both the copy and the popup start inside the click.
  const post = async () => {
    const copied = copyCard();
    const url = 'https://x.com/intent/post?text=' + encodeURIComponent(shareText());
    const w = 600, ht = 680;
    const left = Math.max(0, window.screenX + window.outerWidth - w - 40), top = Math.max(0, window.screenY + 80);
    const popup = window.open(url, 'agentreplay-post', `popup,width=${w},height=${ht},left=${left},top=${top}`);
    if (popup) popup.opener = null;
    const ok = await copied;
    if (!ok) download();
    notice(ok ? 'Image copied to clipboard' : 'Card downloaded',
      ok ? ['Press ', h('kbd', {}, paste), ' in your post to add the card.']
         : ['Your browser blocked copying, so agentreplay-card.png was downloaded. Drag it into your post.'],
      popup ? null : url);
  };
  // The message that walks you from this page to the post. If the popup was
  // blocked, it carries the link instead.
  const notice = (title, body, link) => {
    const done = () => box.remove();
    const box = h('div', {class:'notice', onclick: e => { if (e.target === box) done(); }},
      h('div', {class:'box'},
        h('div', {class:'title'}, h('span', {class:'mark'}), title),
        h('div', {class:'body'}, body),
        h('div', {class:'row2'},
          link && h('a', {class:'btn', href: link, target:'_blank', rel:'noopener', onclick: done}, 'Open X'),
          h('button', {class:'btn', onclick: done}, link ? 'Close' : 'Done'))));
    document.body.append(box);
    box.querySelector('button').focus();
  };
  const overlay = h('div', {class:'overlay', onclick: e => { if (e.target === overlay) close(); }},
    h('div', {class:'panel'}, canvas,
      h('div', {class:'actions'},
        h('button', {class:'btn', onclick: copy}, 'Copy image'),
        h('button', {class:'btn', onclick: post}, 'Post on X'),
        h('button', {class:'btn', onclick: download}, 'Download PNG'),
        status,
        h('button', {class:'btn', onclick: close}, 'Close'))));
  document.addEventListener('keydown', onKey);
  document.body.append(overlay);
}

// ---------------------------------------------------------------- boot

if (D.mode === 'card'){
  document.body.className = 'card';
  const canvas = h('canvas');
  document.getElementById('app').replaceWith(canvas);
  fontsReady().then(() => drawCard(canvas));
} else {
  document.body.append(tip);
  render();
}
</script>
</body>
